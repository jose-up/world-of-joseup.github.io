<!DOCTYPE html>
<html>
    <head>
        <title>A lil more peace & quiet...</title>
        <link rel="stylesheet" href="../styles/secretpersonal.css"/>
        <link rel="icon" type="image/svg+xml" href="../assets/etc/favicon.ico">
        <script src="../scripts/secretpersonal.v2.js" defer></script>
    </head>
    <body>
        <h1>Budget Management</h1>

        <section id="scenario-section">
            <h2>Lists</h2>
            <div id="scenario-controls">
                <label for="scenario-select">Active List: </label>
                <select id="scenario-select"></select>
                <button id="remove-scenario-btn">Remove List</button>
            </div>
            <div id="add-scenario-controls">
                <h3>Add List</h3>
                <label for="new-scenario-name">Name: </label>
                <input type="text" id="new-scenario-name" placeholder="List name">
                <button id="add-scenario-btn">Add List</button>
            </div>
        </section>

        <section id="add-item-section">
            <h2>Add Item</h2>
            <form id="add-item-form">
                <div id="item-grid">
                    <label>Name: <input type="text" id="item-name"></label>
                    <label>Link: <input type="text" id="item-link"></label>
                    <label>Price: <input type="number" id="item-price" step="0.01" min="0"></label>
                    <label>Section:
                        <div id="section-autocomplete">
                            <input type="text" id="item-section" autocomplete="off">
                            <div id="section-dropdown"></div>
                        </div>
                    </label>
                </div>
                <button type="submit">Add Item</button>
            </form>
        </section>

        <div id="tables-container"></div>
    </body>
</html>
