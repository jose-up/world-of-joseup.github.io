<!DOCTYPE html>
<html>
    <head>
        <title>A lil more peace & quiet...</title>
        <link rel="stylesheet" href="../styles/secretpersonal.css"/>
    </head>

    <body>
        <h1>Budget Management</h1>
        <form enctype="text/plain" action="/add-item" method="GET">
            <p id="add-new-item-menu">
                <input type="text" name="item-name" value="Item Name">Name: 
                <input type="text" name="item-link" value="Item Link">Link: 
                <input type="text" name="item-price" value="Item Price">Price: 
                <input type="text" name="item-section" value="Item Section">Section: 
            </p>
            <button type="submit">Add Item</button>
        </form>
        
        <table>
            <caption>On-The-Go Tech</caption>
            <tr>
                <th>Product</th>
                <th>Specs</th>
                <th>Price</th>
            </tr>
            
        </table>
    </body>
</html>
