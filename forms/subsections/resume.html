<html>
    <head>
        <title>The World of Joseup! >:&#41</title>
        <link rel="icon" type="image/svg+xml" href="/assets/etc/favicon.ico">
        <link rel="stylesheet" href="/styles/subsections/resume.css"/>
    </head>
    <body>
        <br>
        <section class="resume-layout">
            <aside class="resume-left">
                <div class="resume-left-card">
                    <div class="icons-row">
                        <a class="rosehulman-icons" href="https://www.rose-hulman.edu/" target="_blank">
                            <img src="/assets/icons/rosehulman.svg"
                            alt="rose-hulman" height="30" width="180" />
                        </a>
                        <a class="rosehulman-icons" href="https://www.binaryheart.org/rose-hulman" target="_blank">
                            <img src="/assets/icons/bhrhit.svg"
                            alt="binaryheart-rhit" height="30" width="40" />
                        </a>
                        <a href="https://www.linkedin.com/in/joseph-zeru/" target="_blank">
                            <img src="/assets/icons/linkedin.svg"
                            alt="rose-hulman rose" height="30" width="30" />
                        </a>
                        <a href="https://www.kaggle.com/josephzeru" target="_blank">
                            <img src="/assets/icons/kaggle.svg"
                            alt="rose-hulman rose" height="30" width="30" />
                        </a>
                    </div>
                    <hr class="left-section-divider">
                    <p class="resume-copy-text">
                        To the right, you can view my resume for an academic overview of
                        my experience and skills in academia. Here, we have some academic
                        highlights, as well as my business card to contact me!
                    </p>
                    <hr class="left-section-divider">
                    <div class="social-embed-row">
                        <div class="business-card-wrap">
                            <iframe
                                class="business-card"
                                data-testid="embed-iframe"
                                src="https://popl.co/profile/joseph-zeru"
                                frameborder="0"
                                allowfullscreen
                                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                                loading="lazy"
                                title="Joseph Zeru Business Card">
                            </iframe>
                        </div>
                        <div class="rolling-info">
                            <img 
                                class="snow-photo" 
                                src="/assets/images/firstdayofsnowrose.webp" 
                                alt="Snow Day at Rose-Hulman" 
                                loading="lazy">
                        </div>
                        <div class="rolling-info">
                            <iframe
                                class="linkedin-embed"
                                src="https://www.linkedin.com/embed/feed/update/urn:li:share:7420917699947491328?collapsed=1"
                                frameborder="0"
                                allowfullscreen=""
                                loading="lazy"
                                title="Highlighted LinkedIn Post">
                            </iframe>
                        </div>
                    </div>
                </div>
            </aside>

                <embed class="resume" src="/assets/etc/OfficialResume.pdf"

            </div>
